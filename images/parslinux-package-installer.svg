<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- App Drop Shadow -->
    <filter id="appShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#021627" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0ea5e9" flood-opacity="0.2"/>
    </filter>

    <!-- Box 3D Shadow -->
    <filter id="boxShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#031d36" flood-opacity="0.38"/>
    </filter>

    <!-- Arrow Luminous Glow -->
    <filter id="arrowGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="38%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#034a75"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Box Gradients (Clean modern technical parcel) -->
    <linearGradient id="topGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Amber / Gold Technical Tape Gradients -->
    <linearGradient id="tapeTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="tapeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="tapeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Badge Gradient (Pars Linux Cyan) -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle with Drop Shadow -->
  <rect x="8" y="7" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" filter="url(#appShadow)"/>
  <rect x="8" y="7" width="112" height="112" rx="26" ry="26" fill="none" stroke="url(#rimGrad)" stroke-width="1.2"/>

  <!-- Subtle Radial Glow behind box -->
  <ellipse cx="64" cy="44" rx="36" ry="22" fill="#ffffff" fill-opacity="0.16"/>

  <!-- 3D Package Box Structure -->
  <g filter="url(#boxShadow)">
    <!-- Left Face -->
    <path d="M28 58 L64 78 L64 105 L28 85 Z" fill="url(#leftGrad)"/>

    <!-- Right Face -->
    <path d="M64 78 L100 58 L100 85 L64 105 Z" fill="url(#rightGrad)"/>

    <!-- Top Face -->
    <path d="M64 38 L100 58 L64 78 L28 58 Z" fill="url(#topGrad)"/>

    <!-- Sealing Tape across Top Center (Mathematically seamless) -->
    <path d="M58 41.33 L64 38 L70 41.33 L70 74.67 L64 78 L58 74.67 Z" fill="url(#tapeTop)"/>
    
    <!-- Tape folding over Left Face -->
    <path d="M58 74.67 L64 78 L64 90 L58 86.67 Z" fill="url(#tapeLeft)"/>

    <!-- Tape folding over Right Face -->
    <path d="M64 78 L70 74.67 L70 86.67 L64 90 Z" fill="url(#tapeRight)"/>

    <!-- Subtle Edge Highlights on the Box -->
    <path d="M28 58 L64 78 L100 58" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.7"/>
    <path d="M64 78 L64 105" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.35"/>
    <path d="M28 58 L28 85" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.4"/>

    <!-- .deb Badge on Left Face with Exact Isometric Shear (-29.05 deg) -->
    <g transform="translate(31, 64) matrix(0.871, 0.491, 0, 1, 0, 0)">
      <rect x="0" y="0" width="32" height="15" rx="3.5" fill="url(#badgeGrad)"/>
      <rect x="0" y="0" width="32" height="15" rx="3.5" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-opacity="0.8"/>
      <!-- Vector .deb Text -->
      <path d="M 0.64 -1.03 C 0.64 -1.41 0.74 -1.69 0.95 -1.84 C 1.16 -2.01 1.41 -2.09 1.69 -2.09 C 1.97 -2.09 2.21 -2.01 2.41 -1.84 C 2.61 -1.69 2.72 -1.41 2.72 -1.03 C 2.72 -0.66 2.61 -0.40 2.41 -0.23 C 2.21 -0.08 1.97 0.00 1.69 0.00 C 1.41 0.00 1.16 -0.08 0.95 -0.23 C 0.74 -0.40 0.64 -0.66 0.64 -1.03 Z M 6.03 0.00 C 5.30 0.00 4.71 -0.29 4.25 -0.88 C 3.79 -1.47 3.56 -2.34 3.56 -3.48 C 3.56 -4.65 3.79 -5.52 4.25 -6.11 C 4.72 -6.70 5.33 -7.00 6.08 -7.00 C 6.55 -7.00 6.92 -6.90 7.20 -6.70 C 7.49 -6.52 7.73 -6.28 7.92 -6.00 L 7.98 -6.00 C 7.95 -6.16 7.93 -6.40 7.91 -6.70 C 7.89 -7.00 7.89 -7.29 7.89 -7.55 L 7.89 -10.00 L 9.70 -10.00 L 9.70 0.00 L 8.31 0.00 L 7.95 -1.02 L 7.89 -1.02 C 7.71 -0.73 7.48 -0.49 7.19 -0.30 C 6.89 -0.10 6.51 0.00 6.03 0.00 Z M 6.66 -1.52 C 7.14 -1.52 7.49 -1.66 7.69 -1.95 C 7.88 -2.24 7.99 -2.68 8.00 -3.27 L 8.00 -3.47 C 8.00 -4.11 7.90 -4.61 7.70 -4.95 C 7.52 -5.30 7.16 -5.47 6.64 -5.47 C 6.25 -5.47 5.95 -5.30 5.73 -4.95 C 5.52 -4.61 5.41 -4.11 5.41 -3.47 C 5.41 -2.81 5.52 -2.32 5.73 -2.00 C 5.95 -1.68 6.26 -1.52 6.66 -1.52 Z M 14.67 -7.00 C 15.59 -7.00 16.30 -6.72 16.83 -6.16 C 17.35 -5.59 17.61 -4.79 17.61 -3.73 L 17.61 -2.77 L 13.41 -2.77 C 13.43 -2.34 13.58 -2.00 13.86 -1.77 C 14.14 -1.52 14.55 -1.41 15.09 -1.41 C 15.50 -1.41 15.87 -1.44 16.20 -1.50 C 16.55 -1.57 16.89 -1.68 17.23 -1.81 L 17.23 -0.48 C 16.92 -0.32 16.58 -0.19 16.22 -0.11 C 15.86 -0.04 15.43 0.00 14.91 0.00 C 14.25 0.00 13.67 -0.12 13.17 -0.38 C 12.67 -0.62 12.27 -1.00 11.98 -1.52 C 11.70 -2.02 11.56 -2.67 11.56 -3.45 C 11.56 -4.63 11.85 -5.52 12.42 -6.11 C 12.99 -6.70 13.74 -7.00 14.67 -7.00 Z M 14.72 -5.66 C 14.36 -5.66 14.07 -5.52 13.84 -5.25 C 13.61 -4.98 13.48 -4.58 13.45 -4.05 L 15.92 -4.05 C 15.91 -4.50 15.80 -4.88 15.61 -5.19 C 15.41 -5.50 15.11 -5.66 14.72 -5.66 Z M 20.69 -7.52 C 20.69 -7.22 20.68 -6.94 20.66 -6.67 C 20.64 -6.41 20.63 -6.18 20.61 -5.98 L 20.69 -5.98 C 20.86 -6.27 21.10 -6.50 21.39 -6.70 C 21.69 -6.90 22.08 -7.00 22.55 -7.00 C 23.27 -7.00 23.87 -6.70 24.33 -6.11 C 24.79 -5.52 25.02 -4.66 25.02 -3.52 C 25.02 -2.36 24.78 -1.48 24.31 -0.89 C 23.85 -0.30 23.25 0.00 22.50 0.00 C 22.02 0.00 21.64 -0.12 21.36 -0.38 C 21.09 -0.62 20.86 -0.89 20.69 -1.19 L 20.56 -1.19 L 20.27 0.00 L 18.88 0.00 L 18.88 -10.00 L 20.69 -10.00 Z M 21.95 -5.48 C 21.50 -5.48 21.18 -5.34 20.98 -5.05 C 20.79 -4.75 20.69 -4.30 20.69 -3.67 L 20.69 -3.45 C 20.69 -2.82 20.78 -2.34 20.97 -2.02 C 21.16 -1.69 21.49 -1.53 21.98 -1.53 C 22.38 -1.53 22.68 -1.70 22.88 -2.05 C 23.07 -2.39 23.17 -2.88 23.17 -3.53 C 23.17 -4.83 22.77 -5.48 21.95 -5.48 Z M 26.00 0.00" transform="translate(5, 11)" fill="#ffffff"/>
    </g>

    <!-- Handle Indent on Right Face with Exact Isometric Shear (+29.05 deg) -->
    <g transform="translate(74, 76) matrix(0.871, -0.491, 0, 1, 0, 0)">
      <rect x="0" y="0" width="18" height="6" rx="3" fill="#334155" fill-opacity="0.28"/>
    </g>
  </g>

  <!-- Glowing Download / Installation Arrow -->
  <g filter="url(#arrowGlow)">
    <!-- Arrow Main Silhouette -->
    <path d="M64 56 L47 37 L57 37 L57 14 L71 14 L71 37 L81 37 Z" fill="url(#arrowGrad)" stroke="#0284c7" stroke-width="1" stroke-linejoin="round"/>
    <!-- Specular rim highlight on arrow -->
    <path d="M64 52 L51 38 L58 38 L58 16 L64 16 Z" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Ambient Light Sparkles -->
  <circle cx="40" cy="26" r="1.6" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="88" cy="23" r="2" fill="#ffffff" fill-opacity="0.9"/>
  <circle cx="91" cy="38" r="1.2" fill="#38bdf8" fill-opacity="0.9"/>
  <circle cx="35" cy="42" r="1" fill="#bae6fd" fill-opacity="0.8"/>
  <circle cx="64" cy="11" r="1" fill="#ffffff" fill-opacity="0.7"/>
</svg>
